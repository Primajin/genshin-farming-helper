name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, closed ]

# Least privilege by default; each caller job grants what its reusable
# workflow needs. The heavy jobs live in reusable `_*.yml` workflows; this file
# orchestrates them and aggregates their results into one `All checks green`
# gate.
permissions: {}

jobs:
  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  lint:
    if: github.event_name == 'push' || github.event.action != 'closed'
    permissions: write-all
    uses: ./.github/workflows/_lint.yml
    secrets: inherit

  build:
    if: github.event_name == 'pull_request'
    permissions: write-all
    uses: ./.github/workflows/_build.yml
    secrets: inherit

  console:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    permissions: write-all
    uses: ./.github/workflows/_console.yml
    secrets: inherit

  screenshots:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    permissions: write-all
    uses: ./.github/workflows/_screenshots.yml
    secrets: inherit

  all-green:
    name: All checks green
    if: always()
    needs:
      - test
      - lint
      - build
      - console
      - screenshots
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed or was cancelled
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)."
              exit 1
            fi
          done
          echo "All jobs succeeded or were skipped."
